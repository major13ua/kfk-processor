plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'xme.common'
version = '0.0.1-SNAPSHOT'
description = 'kfk-processor'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'com.bucket4j:bucket4j_jdk17-lettuce:8.21.0'
    implementation 'io.lettuce:lettuce-core'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-opentelemetry-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-grafana'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-kafka'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

// Container-based tests (*IT and the Spring smoke test) FAIL without Docker, so a CI without Docker cannot pass silently.
// Local opt-out only: ./gradlew test -PskipDockerTests  (runs the unit tests only; never use it in CI).
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'load'
    }
    if (project.hasProperty('skipDockerTests')) {
        exclude '**/*IT.class', '**/KfkProcessorApplicationTests.class'
    }
}

// Slow load/throughput runs (T17): `./gradlew loadTest`; excluded from the default `test` task.
tasks.register('loadTest', Test) {
    description = 'Runs only the tests tagged "load" (throughput run against the NFR target).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'load'
    }
    testLogging {
        showStandardStreams = true
    }
    // pass -Dload.target=... -Dload.seconds=... etc. through to the test JVM
    systemProperties System.properties.findAll { k, v -> k.toString().startsWith('load.') }
    outputs.upToDateWhen { false }
    shouldRunAfter tasks.named('test')
}

// Pre-release run of the performance suite at test-plan scale: `./gradlew preReleaseTest -Dperf.rate.budget=2000
// -Dperf.rate.backlog=600000` (see test-plan.md, "Reduced scale"). Not part of `check`.
tasks.register('preReleaseTest', Test) {
    description = 'Runs the performance ITs; pass -Dperf.* to raise them to full test-plan scale.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        excludeTags 'load'
    }
    filter {
        includeTestsMatching 'xme.common.kfkprocessor.requestreply.performance.*'
    }
    testLogging {
        showStandardStreams = true
    }
    systemProperties System.properties.findAll { k, v -> k.toString().startsWith('perf.') }
    outputs.upToDateWhen { false }
    shouldRunAfter tasks.named('test')
}
